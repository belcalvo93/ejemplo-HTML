# Configuracion minima para que nginx escuche en el 81 en vez del 80
# por defecto, ya que este servicio comparte servidor con otros que
# ya ocupan ese puerto.

server {
    listen 81;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
